

services:
  postgres:
    image: postgres:16-alpine
    container_name: olhosdegato-postgres
    restart: unless-stopped
    ports:
      # 5433 no host: a 5432 é ocupada pelo PostgreSQL nativo do Windows (serviço),
      # que sombrearia o container. DATABASE_URL local usa 127.0.0.1:5433.
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olhosdegato
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: olhosdegato-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
